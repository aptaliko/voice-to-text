services:
  voice-to-text:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      APP_USERNAME: ${APP_USERNAME:?set APP_USERNAME in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
    # Only reachable from the host; nginx on the host terminates HTTPS.
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - models:/models
    # Keep transcription from starving the website on the same server.
    cpus: ${APP_CPUS:-4}
    mem_limit: ${APP_MEMORY:-6g}

  # Local AI for the optional spelling correction (AI_CORRECTION=true).
  # Started only with: docker compose --profile ai up -d
  # On a Mac, run the native Ollama app instead (it uses the GPU) and set
  # AI_URL=http://host.docker.internal:11434 in .env.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    cpus: ${AI_CPUS:-4}
    mem_limit: ${AI_MEMORY:-12g}

volumes:
  models:
  ollama:
