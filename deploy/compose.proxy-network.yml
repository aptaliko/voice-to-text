# Join an existing Docker network so a reverse-proxy container (e.g. the
# website's nginx) can reach the app at http://voice-to-text:8000.
# Enable it from .env:
#   COMPOSE_FILE=docker-compose.yml:deploy/compose.proxy-network.yml
#   PROXY_NETWORK=samosterra_internal
services:
  voice-to-text:
    networks:
      default:
      proxy:
        aliases: [voice-to-text]

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?set PROXY_NETWORK in .env}
